# Contour v0.5 — contour-engine
#
# One model of the Contour System. It can be completed from either end:
# top-down, from the Actors the System serves and the Functions they need, or
# bottom-up, from the Components and Interfaces found in the source code. All
# elements are peers at one level; `rationale` records why a Component or
# Interface exists, in terms of the Actors' needs, Requirements and Guardrails.
# contour-check.py reports contradictions, and the gaps left to fill in either
# direction.

System:
  name: Contour
  description: >-
    Stores, searches and manages Contour specifications — the models and structured records defined by
    the Contour framework — for the people who model with them and for AI agents that work with them.
  requirements: [Console Released Independently, Local start composition]
  guardrails:
  - Follow Technology Radar
  - No Infrastructure In Model
  - One Core For Every Actor
  - Writes Are Validated By The System
  functions:
  - name: Store Element
    description: >-
      Accepts one Contour element — its record and the relationships where it is the "from" side — validates
      it, persists it, and announces the change.
    steps:
    - calls: Validate Element
      becomes: {Invalid: Rejected}
    - {modifies: Contour Element}
    - {modifies: Contour Relationship}
    - {modifies: Contour Record}
    - {produces: Element Stored}
    result: Stored
    alternatives:
      Rejected: >-
        The element breaks the Contour metamodel or conflicts with persisted state; nothing is stored.
    behavior: >-
      Upserts the element row, its record body and its declared outgoing edges in a single transaction.
    requirements: [Element Write Is Atomic, Element Must Be Well Formed]
    guardrails: [Validation Precedes Persistence]
  - name: Delete Element
    description: >-
      Removes one stored element, its record, and every relationship where it is either endpoint, and
      announces the removal.
    steps:
    - {modifies: Contour Relationship}
    - {modifies: Contour Record}
    - {modifies: Contour Element}
    - {produces: Element Deleted}
    result: Deleted
    alternatives: {Already Absent: No such item exists; nothing is deleted.}
    requirements: [Element Write Is Atomic]
  - name: Retrieve Element
    description: >-
      Returns one stored element by id — its record plus its immediate relationships, outgoing and incoming
      — not the whole model.
    steps:
    - {reads: Contour Element}
    - {reads: Contour Relationship}
    - {reads: Contour Record}
    result: Found
    alternatives: {Not Found: No element has this id.}
    guardrails: [Read-only function]
  - name: Validate Element
    description: >-
      Checks one submitted element and its outgoing relationships against the Contour metamodel and against
      already-persisted state.
    steps:
    - {reads: Contour Element}
    - {reads: Contour Requirement}
    - {reads: Contour Guardrail}
    result: Valid
    alternatives: {Invalid: One or more violations were found; they are reported in full.}
    behavior: >-
      Enforces the v0.4 invariants at element scope: a Component has exactly one owning System; a Function,
      Data Object or Event has exactly one owning Component; a relationship target already exists; reads
      and modifies stay within the owning Component; an Interface serves an existing Actor or Components
      and exposes only its own Component's Functions; each exposed Function's responses cover exactly
      its outcomes; a uses step names an Interface that serves Components and exposes its target, and
      maps Unreachable; becomes values are the caller's own alternatives; consumes appears only first;
      Event names are past tense; every referenced Requirement and Guardrail is defined.
    requirements: [Enforce Contour Invariants]
    guardrails: [Read-only function]
  - name: Store Requirement
    description: >-
      Accepts one Requirement definition — id, name and description — validates it, persists it, and announces
      the change.
    steps:
    - {modifies: Contour Requirement}
    - {produces: Requirement Stored}
    result: Stored
    alternatives:
      Invalid: The name or description is blank.
      Name Taken: Another Requirement already has this name.
    requirements: [Definition Write Is Atomic, Definition Name Is Unique]
  - name: Retrieve Requirement
    description: Returns one Requirement definition by name.
    steps:
    - {reads: Contour Requirement}
    result: Found
    alternatives: {Not Found: No Requirement has this name.}
    guardrails: [Read-only function]
  - name: Delete Requirement
    description: Removes one Requirement definition and announces the removal.
    steps:
    - {reads: Contour Record}
    - {modifies: Contour Requirement}
    - {produces: Requirement Deleted}
    result: Deleted
    alternatives:
      Still Referenced: A stored element still references it; the delete is refused.
      Already Absent: No such item exists; nothing is deleted.
    requirements: [Definition Write Is Atomic]
    guardrails: [Referenced Definitions Must Exist]
  - name: Store Guardrail
    description: >-
      Accepts one Guardrail definition — id, name and description — validates it, persists it, and announces
      the change.
    steps:
    - {modifies: Contour Guardrail}
    - {produces: Guardrail Stored}
    result: Stored
    alternatives:
      Invalid: The name or description is blank.
      Name Taken: Another Guardrail already has this name.
    requirements: [Definition Write Is Atomic, Definition Name Is Unique]
  - name: Retrieve Guardrail
    description: Returns one Guardrail definition by name.
    steps:
    - {reads: Contour Guardrail}
    result: Found
    alternatives: {Not Found: No Guardrail has this name.}
    guardrails: [Read-only function]
  - name: Delete Guardrail
    description: Removes one Guardrail definition and announces the removal.
    steps:
    - {reads: Contour Record}
    - {modifies: Contour Guardrail}
    - {produces: Guardrail Deleted}
    result: Deleted
    alternatives:
      Still Referenced: A stored element still references it; the delete is refused.
      Already Absent: No such item exists; nothing is deleted.
    requirements: [Definition Write Is Atomic]
    guardrails: [Referenced Definitions Must Exist]
  - name: Search Specifications
    description: >-
      Finds stored elements by free text over their records and by structural filters — element type,
      name, owning System or Component — one page at a time.
    steps:
    - {reads: Contour Element}
    - {reads: Contour Record}
    result: Found
    behavior: >-
      Returns one page of matches, by relevance for a text query and by name otherwise, with the total
      count. Element-scoped: definitions are searched by Search Requirements and Search Guardrails.
    requirements: [Uses full-text search]
    guardrails: [Proper field indexes, Read-only function]
  - name: Search Requirements
    description: >-
      Finds Requirement definitions by free text over their name and description.
    steps:
    - {reads: Contour Requirement}
    result: Found
    requirements: [Uses full-text search]
    guardrails: [Proper field indexes, Read-only function]
  - name: Search Guardrails
    description: >-
      Finds Guardrail definitions by free text over their name and description.
    steps:
    - {reads: Contour Guardrail}
    result: Found
    requirements: [Uses full-text search]
    guardrails: [Proper field indexes, Read-only function]
  - name: Render Diagram
    description: >-
      Produces a diagram (Mermaid) of a whole stored model — the Context view, or a Functionality-view
      drill-down.
    steps:
    - {reads: Contour Element}
    - {reads: Contour Relationship}
    - {reads: Contour Record}
    result: Rendered
    alternatives: {Model Not Found: No model has this id.}
    behavior: >-
      Derives the diagram from the stored elements and relationships: neighbours half-open, Interfaces
      on the Component boundary, Function labels naming the Interfaces that expose them, cross-Component
      uses labeled with their Interface, step edges as an unordered summary of each Function's steps.
    guardrails: [Read-only function]
  - name: Render Element Diagram
    description: >-
      Produces a diagram (Mermaid) scoped to one element and every relationship where it is either endpoint.
    steps:
    - {reads: Contour Element}
    - {reads: Contour Relationship}
    - {reads: Contour Record}
    result: Rendered
    alternatives: {Not Found: No element has this id.}
    guardrails: [Read-only function]
  dataObjects:
  - name: Contour Element
    description: >-
      One stored Contour element — a System, Component, Interface, Function, Event, Data Object or Actor
      — persisted and retrieved individually rather than as part of a whole-model payload.
    schema:
      id: uuid
      name: string
      version: integer
      modelId: uuid
      systemId: uuid?
      componentId: uuid?
      createdAt: date-time
      updatedAt: date-time
      elementType: enum(System, Component, Interface, Function, Event, DataObject, Actor)
  - name: Contour Relationship
    description: >-
      One edge between two already-persisted elements. Declared and persisted as part of the "from" element's
      Store Element, never submitted on its own.
    schema:
      id: uuid
      modelId: uuid
      fromElementId: uuid
      toElementId: uuid
      verb: >-
        enum(groups, performs, exposes, uses, calls, produces, consumes, reads, modifies, owns, references,
        depends-on)
  - name: Contour Record
    description: >-
      The structured record attached to each element — description, schema, a Function's steps, result
      and alternatives, an Interface's binding and exposed Functions, and referenced requirement and guardrail
      names.
    schema: {id: uuid, elementId: uuid, body: object}
    requirements: [Uses full-text search]
    guardrails: [Proper field indexes]
  - name: Contour Requirement
    description: >-
      One stored Requirement definition (Section 3.6), referenced by name from the elements it applies
      to.
    schema: {id: uuid, name: string, description: string, version: integer, createdAt: date-time, updatedAt: date-time}
    requirements: [Uses full-text search]
    guardrails: [Proper field indexes]
  - name: Contour Guardrail
    description: >-
      One stored Guardrail definition (Section 3.6), referenced by name from the elements it bounds.
    schema: {id: uuid, name: string, description: string, version: integer, createdAt: date-time, updatedAt: date-time}
    requirements: [Uses full-text search]
    guardrails: [Proper field indexes]
  events:
  - name: Element Stored
    description: >-
      One Contour element, its record and its outgoing relationships were created or updated.
    schema:
      elementId: uuid
      modelId: uuid
      name: string
      elementType: Contour Element.elementType
      version: integer
      storedAt: date-time
  - name: Element Deleted
    description: One Contour element, its record and its relationships were removed.
    schema: {elementId: uuid, modelId: uuid, deletedAt: date-time}
  - name: Requirement Stored
    description: One Requirement definition was created or updated.
    schema: {name: string, version: integer, storedAt: date-time}
  - name: Requirement Deleted
    description: One Requirement definition was removed.
    schema: {name: string, deletedAt: date-time}
  - name: Guardrail Stored
    description: One Guardrail definition was created or updated.
    schema: {name: string, version: integer, storedAt: date-time}
  - name: Guardrail Deleted
    description: One Guardrail definition was removed.
    schema: {name: string, deletedAt: date-time}
  components:
  - name: contour-engine
    description: >-
      Stores, validates, searches and renders Contour specifications. Performs every Function and owns
      all Contour data.
    rationale: [One Core For Every Actor, 'principle 4: data has a home']
    performs:
    - Store Element
    - Delete Element
    - Retrieve Element
    - Validate Element
    - Store Requirement
    - Retrieve Requirement
    - Delete Requirement
    - Store Guardrail
    - Retrieve Guardrail
    - Delete Guardrail
    - Search Specifications
    - Search Requirements
    - Search Guardrails
    - Render Diagram
    - Render Element Diagram
    owns:
    - Contour Element
    - Contour Relationship
    - Contour Record
    - Contour Requirement
    - Contour Guardrail
    produces:
    - Element Stored
    - Element Deleted
    - Requirement Stored
    - Requirement Deleted
    - Guardrail Stored
    - Guardrail Deleted
    implements: [Contour MCP Server, Contour REST API]
    requirements: [Local start composition]
  - name: contour-engine-ui
    description: >-
      The browser application a Modeler works in. Presents the Functions the Modeler needs; performs none
      of them and owns no data.
    rationale: [Console Released Independently, Works In A Browser]
    performs: []
    implements: [Contour Console]
    requirements: [Local start composition]
  interfaces:
  - name: Contour Console
    description: >-
      The views a Modeler uses: listing, search, element and definition detail with their diagrams, and
      create, edit and delete. Each view presents one or more exposed Functions — an element's detail
      view shows Retrieve Element and Render Element Diagram together.
    rationale: [Modeler needs, Works In A Browser]
    serves: Modeler
    implementedBy: contour-engine-ui
    through: Contour REST API
    binding: {style: Web UI}
    exposes:
    - Store Element
    - Delete Element
    - Retrieve Element
    - Store Requirement
    - Retrieve Requirement
    - Delete Requirement
    - Store Guardrail
    - Retrieve Guardrail
    - Delete Guardrail
    - Search Specifications
    - Search Requirements
    - Search Guardrails
    - Render Diagram
    - Render Element Diagram
  - name: Contour MCP Server
    description: >-
      Model Context Protocol access for AI Agents, reading and storing Contour specifications as tools.
    rationale: [AI Agent needs, Reaches The System As Tools]
    serves: AI Agent
    implementedBy: contour-engine
    binding: {style: MCP, transport: streamable HTTP, auth: agent token}
    exposes:
      Store Element:
        operation: store_element
        request:
          element: Contour Element { id?, name, elementType, systemId?, componentId? }
          record: Contour Record.body
          relationships: Contour Relationship { verb, toElementId }[]
        responses:
          Stored: {code: result, body: Contour Element}
          Rejected:
            code: result
            body: {violations: 'string[1..]'}
      Delete Element:
        operation: delete_element
        request: {id: uuid}
        responses: {Deleted: result, Already Absent: result}
      Retrieve Element:
        operation: retrieve_element
        request: {id: uuid}
        responses:
          Found:
            code: result
            body: {element: Contour Element, record: Contour Record, relationships: 'Contour Relationship[]'}
          Not Found: error
      Store Requirement:
        operation: store_requirement
        request: {id: uuid, name: string, description: string}
        responses:
          Stored: {code: result, body: Contour Requirement}
          Invalid: error
          Name Taken: error
      Retrieve Requirement:
        operation: retrieve_requirement
        request: {name: string}
        responses:
          Found: {code: result, body: Contour Requirement}
          Not Found: error
      Delete Requirement:
        operation: delete_requirement
        request: {name: string}
        responses: {Deleted: result, Already Absent: result, Still Referenced: error}
      Store Guardrail:
        operation: store_guardrail
        request: {id: uuid, name: string, description: string}
        responses:
          Stored: {code: result, body: Contour Guardrail}
          Invalid: error
          Name Taken: error
      Retrieve Guardrail:
        operation: retrieve_guardrail
        request: {name: string}
        responses:
          Found: {code: result, body: Contour Guardrail}
          Not Found: error
      Delete Guardrail:
        operation: delete_guardrail
        request: {name: string}
        responses: {Deleted: result, Already Absent: result, Still Referenced: error}
      Search Specifications:
        operation: search_specifications
        request:
          query: string?
          elementType: Contour Element.elementType?
          name: string?
          systemId: uuid?
          componentId: uuid?
          page: integer?
          pageSize: integer?
        responses:
          Found:
            code: result
            body: {items: 'Contour Element { id, name, elementType }[]', total: integer}
      Search Requirements:
        operation: search_requirements
        request: {query: string}
        responses:
          Found: {code: result, body: 'Contour Requirement[]'}
      Search Guardrails:
        operation: search_guardrails
        request: {query: string}
        responses:
          Found: {code: result, body: 'Contour Guardrail[]'}
      Render Diagram:
        operation: render_diagram
        request: {modelId: uuid}
        responses:
          Rendered:
            code: result
            body: {mermaid: string}
          Model Not Found: error
      Render Element Diagram:
        operation: render_element_diagram
        request: {id: uuid}
        responses:
          Rendered:
            code: result
            body: {mermaid: string}
          Not Found: error
  - name: Contour REST API
    description: >-
      REST/JSON access for other Components — derived because the Console is implemented apart from the
      Functions it presents.
    rationale:
    - >-
      allocation: Contour Console is implemented by contour-engine-ui, its Functions by contour-engine
    serves: Components
    implementedBy: contour-engine
    binding: {style: OpenAPI, base: /api/v1, auth: service token, errors: RFC 7807}
    requirements: [Generate OpenAPI From The Interface]
    exposes:
      Store Element:
        operation: POST /elements
        request:
          element: Contour Element { id?, name, elementType, systemId?, componentId? }
          record: Contour Record.body
          relationships: Contour Relationship { verb, toElementId }[]
        responses:
          Stored: {code: 200, body: Contour Element}
          Rejected:
            code: 422
            body: {violations: 'string[1..]'}
      Delete Element:
        operation: DELETE /elements/{id}
        request: {id: uuid}
        responses: {Deleted: 204, Already Absent: 204}
      Retrieve Element:
        operation: GET /elements/{id}
        request: {id: uuid}
        responses:
          Found:
            code: 200
            body: {element: Contour Element, record: Contour Record, relationships: 'Contour Relationship[]'}
          Not Found: 404
      Store Requirement:
        operation: PUT /requirements/{id}
        request: {id: uuid, name: string, description: string}
        responses:
          Stored: {code: 200, body: Contour Requirement}
          Invalid: 400
          Name Taken: 409
      Retrieve Requirement:
        operation: GET /requirements/{name}
        request: {name: string}
        responses:
          Found: {code: 200, body: Contour Requirement}
          Not Found: 404
      Delete Requirement:
        operation: DELETE /requirements/{name}
        request: {name: string}
        responses: {Deleted: 204, Already Absent: 204, Still Referenced: 409}
      Store Guardrail:
        operation: PUT /guardrails/{id}
        request: {id: uuid, name: string, description: string}
        responses:
          Stored: {code: 200, body: Contour Guardrail}
          Invalid: 400
          Name Taken: 409
      Retrieve Guardrail:
        operation: GET /guardrails/{name}
        request: {name: string}
        responses:
          Found: {code: 200, body: Contour Guardrail}
          Not Found: 404
      Delete Guardrail:
        operation: DELETE /guardrails/{name}
        request: {name: string}
        responses: {Deleted: 204, Already Absent: 204, Still Referenced: 409}
      Search Specifications:
        operation: GET /elements
        request:
          query: string?
          elementType: Contour Element.elementType?
          name: string?
          systemId: uuid?
          componentId: uuid?
          page: integer?
          pageSize: integer?
        responses:
          Found:
            code: 200
            body: {items: 'Contour Element { id, name, elementType }[]', total: integer}
      Search Requirements:
        operation: GET /requirements
        request: {query: string}
        responses:
          Found: {code: 200, body: 'Contour Requirement[]'}
      Search Guardrails:
        operation: GET /guardrails
        request: {query: string}
        responses:
          Found: {code: 200, body: 'Contour Guardrail[]'}
      Render Diagram:
        operation: GET /models/{modelId}/diagram
        request: {modelId: uuid}
        responses:
          Rendered:
            code: 200
            body: {mermaid: string}
          Model Not Found: 404
      Render Element Diagram:
        operation: GET /elements/{id}/diagram
        request: {id: uuid}
        responses:
          Rendered:
            code: 200
            body: {mermaid: string}
          Not Found: 404

Actor:
- name: Modeler
  description: >-
    A person who works with Contour specifications — an architect, developer or analyst — browsing, reading
    and editing them.
  needs:
  - Store Element
  - Delete Element
  - Retrieve Element
  - Store Requirement
  - Retrieve Requirement
  - Delete Requirement
  - Store Guardrail
  - Retrieve Guardrail
  - Delete Guardrail
  - Search Specifications
  - Search Requirements
  - Search Guardrails
  - Render Diagram
  - Render Element Diagram
  requirements: [Works In A Browser, Listings Are Paginated]
  guardrails: [Diagrams Are Shown As Rendered]
- name: AI Agent
  description: >-
    An LLM or agent that reads and stores Contour specifications on someone's behalf.
  needs:
  - Store Element
  - Delete Element
  - Retrieve Element
  - Store Requirement
  - Retrieve Requirement
  - Delete Requirement
  - Store Guardrail
  - Retrieve Guardrail
  - Delete Guardrail
  - Search Specifications
  - Search Requirements
  - Search Guardrails
  - Render Diagram
  - Render Element Diagram
  requirements: [Reaches The System As Tools]

Requirement:
- name: Local start composition
  description: >-
    A local development build must start with full features from a docker composition of the necessary
    modules.
- name: Element Write Is Atomic
  description: >-
    Store Element persists the element, its record and its outgoing relationships in one transaction,
    or none of it; Delete Element removes the element, its record and every relationship referencing it
    in one transaction, or none of it.
- name: Element Must Be Well Formed
  description: >-
    A submitted element and its outgoing relationships must pass Validate Element before anything is persisted;
    a submission with any violation is rejected in full.
- name: Enforce Contour Invariants
  description: >-
    Validate Element enforces the Contour v0.4 metamodel rules and consistency checks (Section 3.3) that
    can be decided at element scope, against already-persisted state.
- name: Definition Write Is Atomic
  description: >-
    Storing or deleting a Requirement or Guardrail definition happens in one transaction, or not at all.
- name: Definition Name Is Unique
  description: >-
    Requirement and Guardrail names are what elements reference them by; a definition whose name another
    definition of the same kind already has is refused, so a name always resolves to exactly one definition.
- name: Uses full-text search
  description: >-
    Every search over stored specifications is full-text over the searched item's name and all its descriptive
    fields, not just exact identifiers.
- name: Listings Are Paginated
  description: >-
    A listing the Console presents is requested in bounded pages with a stable, repeatable order and a
    total count, never as the whole collection at once.
- name: Console Released Independently
  description: >-
    What a Modeler sees and does in the browser can be changed and released without releasing, migrating
    or restarting the storage and validation of Contour data.
- name: Works In A Browser
  description: >-
    The Modeler works with the System in a web browser, with nothing to install.
- name: Reaches The System As Tools
  description: >-
    An AI Agent reaches the System as a set of tools it can discover and call through the Model Context
    Protocol.
- name: Generate OpenAPI From The Interface
  description: >-
    The OpenAPI specification is assembled from the Contour REST API Interface of this record and kept
    in resources as the source for code generation; it is regenerated whenever the Interface changes,
    never edited by hand.

Guardrail:
- name: Follow Technology Radar
  description: >-
    Technology choices must be compatible with the environment's Technology Radar.
- name: No Infrastructure In Model
  description: >-
    contour-engine must not represent infrastructure (database, runtime, cloud topology) as Contour elements
    in the specifications it stores or renders (principle 5).
- name: Validation Precedes Persistence
  description: >-
    Store Element never writes any Data Object before Validate Element has ended Valid. Validation is
    not advisory and is never skipped or run after the write.
- name: Referenced Definitions Must Exist
  description: >-
    The Requirement and Guardrail names an element references resolve to stored definitions. A definition
    still referenced by a stored element is never deleted; the delete is refused.
- {name: Read-only function, description: The Function modifies no Data Object; it only reads.}
- {name: Proper field indexes, description: Fields that are part of search queries are indexed.}
- name: One Core For Every Actor
  description: >-
    Every Actor reaches the same Functions and the same Data Objects. However they reach the System, no
    channel reimplements storage, search, validation or rendering.
- name: Writes Are Validated By The System
  description: >-
    Every create, edit or delete an Actor makes goes through the System's own Functions, which decide
    validity; nothing presents a write as done before they have.
- name: Diagrams Are Shown As Rendered
  description: >-
    A Modeler sees the diagram Render Diagram or Render Element Diagram produces, unchanged; nothing re-derives
    a diagram or alters its notation.
